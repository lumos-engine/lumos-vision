[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-sight"
version = "0.1.0"
description = "Turn an RTSP camera pointed at a screen into a rectified, cropped, low-latency virtual webcam."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
screensight = "processor.cli:main"

[tool.setuptools.packages.find]
include = ["processor*"]

[tool.setuptools.package-data]
"processor.web" = ["static/*"]
"processor.config" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
