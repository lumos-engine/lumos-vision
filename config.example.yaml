# Screen Sight -- example configuration
#
# Copy to config.yaml and edit.  Everything here is optional: any key you
# leave out keeps its default, so a working config can be four lines long.
# Run `screensight config` to print the full expanded configuration with defaults.
#
# With this file as config.yaml you can start with:
#   python -m processor run

camera:
  source: v4l2                      # rtsp | v4l2 | usb | file | image | synthetic
  # Current: Vimicro Altair (max 640x480).  For Logitech C-series use:
  #   device: /dev/video2
  #   capture_width: 1280
  #   capture_height: 720
  # and set output/perspective to 1280x720 below.
  device: /dev/video4
  capture_width: 640
  capture_height: 480
  # controls:                       # hardware (v4l2-ctl); names vary by camera
  #   exposure_auto: 1
  #   exposure_absolute: 300
  #   brightness: 128
  #   gain: 0
  controls: {}
  process_width: 0
  read_timeout: 8.0
  reconnect_delay: 2.0

  # Wi-Fi / ONVIF RTSP alternative:
  # source: rtsp
  # rtsp_url: "rtsp://admin:CHANGEME@192.168.1.93:5543/live/channel10"
  # transport: tcp
  rtsp_url: ""
  transport: tcp

output:
  width: 640                        # match HyperHDR; 1280 if using Logitech
  height: 360
  fps: 20
  v4l2:
    enabled: true
    device: /dev/video10
    pixel_format: YUYV              # must match HyperHDR exactly
    flip_horizontal: false
    flip_vertical: false            # true if HyperHDR preview is upside-down

  mjpeg:
    enabled: true
    host: 0.0.0.0
    port: 7661

# Calibration wizard: http://<host>:7660
web:
  enabled: true
  host: 0.0.0.0                     # 127.0.0.1 if you only want local access
  port: 7660

boundary:
  # auto   -- find the TV continuously
  # manual -- always use the corners below (what the wizard writes)
  # hybrid -- use the corners below until the camera is bumped, then re-detect
  mode: hybrid
  auto_recalibrate: true
  # Normalised 0..1, top-left, top-right, bottom-right, bottom-left.
  # Leave null to detect automatically.
  corners: null

movement:
  enabled: true
  check_interval: 0.5
  ncc_threshold: 1.0                # lower = more eager to recalibrate

perspective:
  # Rectified working size.  Match output for best letterbox detection.
  width: 640
  height: 360

crop:
  inset_percent: 2.0                # trims bezel and the glowing panel rim

blackbars:
  enabled: true
  luma_threshold: 48                # USB letterbox is rarely true-black
  max_crop_percent: 40              # cinema 2.39:1 needs ~13%+ per side
  window: 21
  hold_frames: 14
  max_step_percent: 1.0

reflection:
  margin_percent: 2.0               # ignore this much of each edge
  # Blank out a static logo or clock so it stops tinting one LED all evening.
  # Each entry is [x, y, width, height], normalised.
  exclusions: []

color:
  white_balance: "off"              # off | auto | manual (quoted: YAML reads
                                    # a bare off as the boolean false)
  gamma: 1.0                        # >1 brightens midtones
  saturation: 1.2
  brightness: 1.0
  contrast: 1.0
  exposure:
    enabled: false
    target_luma: 110

debug:
  enabled: false
  view: output                      # or: source, boundary, perspective, grid

logging:
  level: INFO
  stats_interval: 30                # seconds between throughput log lines

