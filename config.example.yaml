# Screen Sight -- example configuration
#
# Copy to config.yaml and edit.  Everything here is optional: any key you
# leave out keeps its default, so a working config can be four lines long.
# Run `screensight config` to print the full expanded configuration with defaults.

camera:
  source: rtsp                      # rtsp | v4l2 | usb | file | image | synthetic
  # Paths are stable; encoder resolution is not.  Verify with ffprobe before
  # assuming channel10 is the high-res stream (it may be 640x360).
  rtsp_url: "rtsp://admin:CHANGEME@192.168.1.93:5543/live/channel10"
  transport: tcp                    # tcp is much more reliable than udp
  # USB webcam on the same machine (Logitech etc.).  Example:
  #   source: v4l2
  #   device: /dev/video2
  #   capture_width: 1280
  #   capture_height: 720
  #   controls:                   # hardware (v4l2-ctl); names vary by camera
  #     exposure_auto: 1          # 1 = manual on many Logitech cams
  #     exposure_absolute: 300
  #     brightness: 128
  #     gain: 0
  device: ""
  controls: {}
  # 0 = keep native camera resolution (preferred).  Set e.g. 960 only if the
  # host is too slow for full-res processing.
  process_width: 0
  read_timeout: 8.0                 # seconds without a frame before reconnect
  reconnect_delay: 2.0

output:
  width: 1280
  height: 720
  fps: 20
  v4l2:
    enabled: true
    device: /dev/video10
    pixel_format: YUYV              # YUYV | RGB24 | BGR24

  # Handy for checking the result from another machine; off by default
  # because encoding JPEGs costs CPU that the pipeline would rather have.
  mjpeg:
    enabled: false
    host: 0.0.0.0
    port: 7661

# The browser calibration wizard: http://localhost:7660
web:
  enabled: false
  host: 127.0.0.1                   # 0.0.0.0 exposes an unauthenticated tuner
  port: 7660

boundary:
  # auto   -- find the TV continuously
  # manual -- always use the corners below (what the wizard writes)
  # hybrid -- use the corners below until the camera is bumped, then re-detect
  mode: hybrid
  auto_recalibrate: true
  # Normalised 0..1, top-left, top-right, bottom-right, bottom-left.
  # Leave null to detect automatically.
  corners: null

movement:
  enabled: true
  check_interval: 0.5
  ncc_threshold: 1.0                # lower = more eager to recalibrate

perspective:
  # Rectified working size.  Match output for best letterbox detection.
  # Drop to 640x360 on a very slow machine.
  width: 1280
  height: 720

crop:
  inset_percent: 2.0                # trims bezel and the glowing panel rim

blackbars:
  enabled: true
  luma_threshold: 40                # USB letterbox is rarely true-black; raise if bars remain
  max_crop_percent: 40              # cinema 2.39:1 needs ~13%+ per side; headroom helps
  # Anti-flicker.  Raise window/hold_frames if the crop still twitches;
  # lower max_step_percent to make changes ease in more slowly.
  window: 15
  hold_frames: 8
  max_step_percent: 1.0

reflection:
  margin_percent: 2.0               # ignore this much of each edge
  # Blank out a static logo or clock so it stops tinting one LED all evening.
  # Each entry is [x, y, width, height], normalised.
  exclusions: []

color:
  white_balance: "off"              # off | auto | manual (quoted: YAML reads
                                    # a bare off as the boolean false)
  gamma: 1.0                        # >1 brightens midtones
  saturation: 1.2
  brightness: 1.0
  contrast: 1.0
  exposure:
    enabled: false
    target_luma: 110

debug:
  enabled: false
  view: output                      # or: source, boundary, perspective, grid

logging:
  level: INFO
  stats_interval: 30                # seconds between throughput log lines

